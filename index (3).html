/* ====== EDITE AQUI ====== */
/* Troque os links abaixo (no HTML, em href="...") pelas suas vitrines. */
:root{
  --bg:#03060f; --bg2:#071230; --ink:#eaf2ff; --mute:#8fa6d4;
  --blue:#2f7bff; --ice:#7fd0ff; --line:rgba(127,208,255,.22);
  --card:rgba(10,24,64,.55);
  --font:"Sora","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0}
html,body{min-height:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{
  font-family:var(--font);color:var(--ink);background:var(--bg);
  background-image:radial-gradient(60% 40% at 50% 0%,rgba(47,123,255,.35),transparent 70%);
  display:flex;justify-content:center;padding:40px 18px 56px;
}
main{width:100%;max-width:460px;display:flex;flex-direction:column;align-items:center;text-align:center}
.avatar{
  width:96px;height:96px;border-radius:50%;display:grid;place-items:center;
  font-size:34px;font-weight:700;letter-spacing:.02em;
  background:radial-gradient(circle at 30% 25%,#1b3f9a,#050b22);
  border:2px solid var(--ice);box-shadow:0 0 0 6px rgba(47,123,255,.15),0 0 40px rgba(47,123,255,.55);
}
h1{margin-top:20px;font-size:1.6rem;font-weight:700;letter-spacing:.01em}
.bio{margin-top:8px;color:var(--mute);font-size:.95rem;line-height:1.5;max-width:32ch}
.list{margin-top:34px;width:100%;display:flex;flex-direction:column;gap:14px}
.btn{
  position:relative;display:flex;align-items:center;gap:14px;text-align:left;
  padding:16px 18px;border-radius:14px;text-decoration:none;color:var(--ink);
  background:var(--card);border:1px solid var(--line);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  transition:transform .18s,border-color .18s,box-shadow .18s;
}
.btn:hover,.btn:focus-visible{transform:translateY(-2px);border-color:var(--ice);box-shadow:0 0 28px rgba(47,123,255,.45);outline:none}
.btn:focus-visible{outline:2px solid var(--ice);outline-offset:3px}
.ico{
  flex:none;width:44px;height:44px;border-radius:11px;display:grid;place-items:center;
  overflow:hidden;
}
.ico svg,.ico img{width:100%;height:100%;display:block;object-fit:cover}
.txt{display:flex;flex-direction:column;gap:2px;flex:1}
.txt b{font-size:1.02rem;font-weight:600}
.txt small{color:var(--mute);font-size:.82rem}
.go{color:var(--ice);font-size:1.3rem}
footer{margin-top:40px;color:var(--mute);font-size:.8rem}
</style>
